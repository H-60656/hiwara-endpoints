name: collect-endpoints

# 为什么在 GitHub 上跑：
#   iwara 的花名 CDN 主机（herta / hook / naja / zani / aiko ...）是动态分配的，
#   每台 IP 都不同，而且会变。写死在客户端里的种子表必然过时。
#   Actions 的 runner 在境外，DNS 天然干净，能直接拿到真实 A 记录 ——
#   这件事在国内网络里做不到（UDP/TCP 53 全被劫持，只有 DoT 偶尔能用）。

on:
  schedule:
    # 一小时一轮。GitHub 的 cron 用 UTC，且高负载时会排队延迟几分钟，
    # 这对我们没影响（数据本来就是"最近一小时的快照"）。
    #
    # 注意：这个仓库刚建时用 "17 * * * *" 遇到过 schedule 连续 5 轮一次都没触发
    # （push 与 workflow_dispatch 都正常，只有 schedule 为 0，timing 接口也没有
    # 计费记录）。GitHub 社区里对新建仓库有同样的报告（community discussions
    # #203822 / #185828 / #159649），官方没有给出注册延迟的具体时长。
    # 这里改成整点后的第一个分钟，并保留一条备用分钟位；改完推一次会让 GitHub
    # 重新注册这个 schedule。
    - cron: "3 * * * *"
    - cron: "33 * * * *"
  workflow_dispatch: {}          # 支持手动触发，方便改完脚本立刻验证
  push:
    branches: [main]
    paths:                         # 只改脚本/文档时不重跑采集
      - "scripts/collect.py"
      - ".github/workflows/*.yml"

# 只需要写自己仓库的内容
permissions:
  contents: write

# 同一时刻只跑一轮，避免两次提交打架
concurrency:
  group: collect-endpoints
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: 检出
        uses: actions/checkout@v4

      - name: 装 Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # 纯标准库，没有 requirements.txt。这一步如果将来加了依赖会自动生效。
      - name: 采集
        run: python scripts/collect.py --limit 32
        env:
          PYTHONIOENCODING: utf-8

      - name: 校验产出结构
        run: python scripts/collect.py --check

      - name: 看看这轮拿到了多少
        run: |
          python - <<'PY'
          import json
          with open("endpoints.json", encoding="utf-8") as fh:
              data = json.load(fh)
          hosts = data["hosts"]
          total = sum(len(v["ips"]) for v in hosts.values())
          print(f"生成时间 {data['generated_at']}")
          print(f"扫描视频 {data['sampled_videos']} 个")
          print(f"主机 {len(hosts)} 台 / IP {total} 个")
          for host, info in sorted(hosts.items()):
              print(f"  {host:24} {','.join(info['ips'])}")
          PY

      - name: 提交变更
        run: |
          if git diff --quiet -- endpoints.json; then
            echo "本轮结果与上次一致，不提交"
            exit 0
          fi
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add endpoints.json
          git commit -m "chore: 刷新 endpoints.json（$(date -u '+%Y-%m-%dT%H:%M:%SZ')）"
          git push

      # 采集失败时让 job 变红（上面的 run 步骤已经会非 0 退出）。
      # 「不发坏数据」比「每小时都有提交」重要。

name: collect-endpoints

# 为什么在 GitHub 上跑：
#   iwara 的花名 CDN 主机（herta / hook / naja / zani / aiko ...）是动态分配的，
#   每台 IP 都不同，而且会变。写死在客户端里的种子表必然过时。
#   Actions 的 runner 在境外，DNS 天然干净，能直接拿到真实 A 记录 ——
#   这件事在国内网络里做不到（UDP/TCP 53 全被劫持，只有 DoT 偶尔能用）。

on:
  schedule:
    # 一小时一轮。GitHub 的 cron 用 UTC，且高负载时会排队延迟几分钟，
    # 这对我们没影响（数据本来就是"最近一小时的快照"）。
    #
    # ⚠️ 这个仓库的 schedule 一直不稳定，实测记录（UTC 2026-11-03）：
    #      - 03:27 建仓 → 16:25，约 12 小时里 schedule 0 次（push / workflow_dispatch 全部正常，
    #        workflow 也一直 state=active）。社区同症状：discussions #203822 / #185828 / #159649。
    #      - 16:29 推了一个空提交 → 立刻冒出 16:26、16:48 两轮 schedule（都 success）。
    #      - 17:03 / 17:33 / 18:03 / 18:33 又全部没跑。
    #      - 18:29 再推一个空提交 → 到 19:01 仍然 0 轮，没再恢复。
    #
    #    结论：空提交能让它「偶发跑几轮」，但不是可靠修复。所以：
    #      * 别指望这里的 cron 准时。真正的刷新靠 push（改脚本时）与手动 dispatch。
    #      * 想真定时，得用外部定时器打 workflow_dispatch（cron 之外唯一的稳定通道）。
    #      * App 端完全不依赖这里的准时性：降级链（快照 → DoT → 邻居 → 种子）
    #        保证拿不到快照也能播，只是每台主机多花几百毫秒去查 DoT。
    - cron: "3 * * * *"
    - cron: "33 * * * *"
  workflow_dispatch: {}          # 支持手动触发，方便改完脚本立刻验证
  push:
    branches: [main]
    paths:                         # 只改脚本/文档时不重跑采集
      - "scripts/collect.py"
      - ".github/workflows/*.yml"

# 只需要写自己仓库的内容
permissions:
  contents: write

# 同一时刻只跑一轮，避免两次提交打架
concurrency:
  group: collect-endpoints
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: 检出
        uses: actions/checkout@v4

      - name: 装 Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # 纯标准库，没有 requirements.txt。这一步如果将来加了依赖会自动生效。
      - name: 采集
        run: python scripts/collect.py --limit 32
        env:
          PYTHONIOENCODING: utf-8

      - name: 校验产出结构
        run: python scripts/collect.py --check

      - name: 看看这轮拿到了多少
        run: |
          python - <<'PY'
          import json
          with open("endpoints.json", encoding="utf-8") as fh:
              data = json.load(fh)
          hosts = data["hosts"]
          total = sum(len(v["ips"]) for v in hosts.values())
          print(f"生成时间 {data['generated_at']}")
          print(f"扫描视频 {data['sampled_videos']} 个")
          print(f"主机 {len(hosts)} 台 / IP {total} 个")
          for host, info in sorted(hosts.items()):
              print(f"  {host:24} {','.join(info['ips'])}")
          PY

      # 提交前要能容忍撞车：采集本身跑 50 秒，这段时间里别人（人或 CI）往 main
      # 推了东西，裸 `git push` 就会 `! [rejected] main -> main (fetch first)`。
      # 2026-11-03 17:21 的 run#9 就是这么失败的（当时正在用 contents API 改本文件）。
      # 重试策略：push 失败就重新拉最新的 main，把本轮采集结果重新落上去再推，
      # 始终以本轮数据为准（它是刚采的，比远端那份新）。
      - name: 提交变更
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          if git diff --quiet -- endpoints.json; then
            echo "本轮结果与上次一致，不提交"
            exit 0
          fi

          cp endpoints.json "$RUNNER_TEMP/endpoints.json.new"

          for attempt in 1 2 3; do
            if [ "$attempt" -gt 1 ]; then
              cp "$RUNNER_TEMP/endpoints.json.new" endpoints.json
            fi
            git add endpoints.json
            git commit -m "chore: 刷新 endpoints.json（$(date -u '+%Y-%m-%dT%H:%M:%SZ')）" || true

            if git push origin HEAD:main; then
              echo "第 ${attempt} 次推送成功"
              exit 0
            fi

            echo "第 ${attempt} 次推送失败，拉取最新 main 后重试"
            git fetch origin main || true
            git reset --hard origin/main || true
            sleep $((attempt * 5))
          done

          echo "连续 3 次推送失败，放弃本轮（数据下一轮会重新采集）"
          exit 1

      # 采集失败时让 job 变红（上面的 run 步骤已经会非 0 退出）。
      # 「不发坏数据」比「每小时都有提交」重要。

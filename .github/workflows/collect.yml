name: collect-endpoints

# 为什么在 GitHub 上跑：
#   iwara 的花名 CDN 主机（herta / hook / naja / zani / aiko ...）是动态分配的，
#   每台 IP 都不同，而且会变。写死在客户端里的种子表必然过时。
#   Actions 的 runner 在境外，DNS 天然干净，能直接拿到真实 A 记录 ——
#   这件事在国内网络里做不到（UDP/TCP 53 全被劫持，只有 DoT 偶尔能用）。

on:
  schedule:
    # 一小时一轮。GitHub 的 cron 用 UTC，且高负载时会排队延迟几分钟，
    # 这对我们没影响（数据本来就是"最近一小时的快照"）。
    #
    # ⚠️ 实测结论（2026-11-03，共观察 5 轮 / 约 12 小时）：这个 schedule 一次都没触发过。
    #    - 用 "17 * * * *" 观察 5 轮：0 次；改成下面两条再观察 23 个窗口：仍然 0 次。
    #    - 另加了一个最简探针 schedule-ping.yml（"*/10 * * * *"）观察 5 个窗口：也是 0 次。
    #    - 同期 push 与 workflow_dispatch 全部正常 success，timing 接口没有任何计费记录，
    #      workflow 的 state=active，文件确实在默认分支上。
    #    ⇒ 不是 cron 写错，是这个仓库的 schedule 注册在 GitHub 一侧没生效
    #      （新建仓库的已知现象，社区 discussions #203822 / #185828 / #159649 同症状，
    #       官方未给出注册延迟时长）。换分钟位、加备用条、重新 push 都没能促成注册。
    #
    #    因此：**不要指望这里的 cron**。endpoints.json 的实际刷新靠两件事：
    #      1. scripts/collect.py 或本文件一改，push 触发一次（见下面的 push.paths）；
    #      2. 需要新数据时手动 dispatch 一次（App 端不受影响，降级链保证拿不到快照也能播）。
    #    真要定时化，得换 repository_dispatch + 外部定时器（云函数 / 自己的机器）。
    - cron: "3 * * * *"
    - cron: "33 * * * *"
  workflow_dispatch: {}          # 支持手动触发，方便改完脚本立刻验证
  push:
    branches: [main]
    paths:                         # 只改脚本/文档时不重跑采集
      - "scripts/collect.py"
      - ".github/workflows/*.yml"

# 只需要写自己仓库的内容
permissions:
  contents: write

# 同一时刻只跑一轮，避免两次提交打架
concurrency:
  group: collect-endpoints
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: 检出
        uses: actions/checkout@v4

      - name: 装 Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # 纯标准库，没有 requirements.txt。这一步如果将来加了依赖会自动生效。
      - name: 采集
        run: python scripts/collect.py --limit 32
        env:
          PYTHONIOENCODING: utf-8

      - name: 校验产出结构
        run: python scripts/collect.py --check

      - name: 看看这轮拿到了多少
        run: |
          python - <<'PY'
          import json
          with open("endpoints.json", encoding="utf-8") as fh:
              data = json.load(fh)
          hosts = data["hosts"]
          total = sum(len(v["ips"]) for v in hosts.values())
          print(f"生成时间 {data['generated_at']}")
          print(f"扫描视频 {data['sampled_videos']} 个")
          print(f"主机 {len(hosts)} 台 / IP {total} 个")
          for host, info in sorted(hosts.items()):
              print(f"  {host:24} {','.join(info['ips'])}")
          PY

      - name: 提交变更
        run: |
          if git diff --quiet -- endpoints.json; then
            echo "本轮结果与上次一致，不提交"
            exit 0
          fi
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add endpoints.json
          git commit -m "chore: 刷新 endpoints.json（$(date -u '+%Y-%m-%dT%H:%M:%SZ')）"
          git push

      # 采集失败时让 job 变红（上面的 run 步骤已经会非 0 退出）。
      # 「不发坏数据」比「每小时都有提交」重要。

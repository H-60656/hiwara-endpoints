name: schedule-ping

# 诊断用的探针：只回答一个问题 ——
# 「这个仓库的 schedule 事件到底会不会被 GitHub 触发」。
#
# 实测记录（2026-11-03）：
#   - 15:07 建好、cron 是最简单的 */10、state=active；
#   - 跨过 15:10 / 15:20 / 15:30 / 15:40 / 15:50 五个窗口，schedule 触发 0 次；
#   - 同期 collect-endpoints 的 "3,33 * * * *" 也已连续 23 个窗口 0 次；
#   - workflow_dispatch 与 push 都正常 success，timing 接口没有任何计费记录。
# 结论不是 cron 写错，而是这个仓库的 schedule 注册在 GitHub 一侧没生效。
#
# 后续（同一天）：
#   16:29Z 推了一个空提交 → 立刻恢复，16:26 与 16:48 两轮都跑了；
#   17:03Z 之后又全停（17:03 / 17:33 / 18:03 / 18:33 四轮 0 次）；
#   18:29Z 再推空提交 → 到 19:01Z 仍然 0 轮，没恢复。
#
# 所以这不是一次性延迟，而是会反复的。「空提交」只能碰运气。
# 保留它做金丝雀：一天跑一次。
#   - 它跑了而 collect 没跑 → 只是 collect 那条被漏了；
#   - 两条都不跑 → schedule 整体不通，改用外部定时器打 workflow_dispatch 更靠谱。
# 别把它当监控，把它当探针。诊断用途结束后可以删。

on:
  schedule:
    - cron: "7 4 * * *"
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: 报一声到
        run: |
          echo "schedule ping at $(date -u '+%Y-%m-%dT%H:%M:%SZ')"
          echo "event=${{ github.event_name }}"
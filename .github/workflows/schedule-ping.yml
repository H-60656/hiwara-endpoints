name: schedule-ping

# 诊断用的探针：只回答一个问题 ——
# 「这个仓库的 schedule 事件到底会不会被 GitHub 触发」。
#
# 实测记录（2026-11-03）：
#   - 15:07 建好、cron 是最简单的 */10、state=active；
#   - 跨过 15:10 / 15:20 / 15:30 / 15:40 / 15:50 五个窗口，schedule 触发 0 次；
#   - 同期 collect-endpoints 的 "3,33 * * * *" 也已连续 23 个窗口 0 次；
#   - workflow_dispatch 与 push 都正常 success，timing 接口没有任何计费记录。
# 结论不是 cron 写错，而是新仓库的 schedule 注册在 GitHub 一侧没生效。
# 16:29Z 往 main 推了一个空提交之后立刻恢复：16:26 与 16:48 两轮 schedule 都成功跑完。
#
# 保留它做金丝雀：一天跑一次。哪天它不跑而 collect 还在跑，说明只是这条被漏了；
# 哪天两条都不跑，就再补一个空提交。诊断用途结束后可以删。

on:
  schedule:
    - cron: "7 4 * * *"
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: 报一声到
        run: |
          echo "schedule ping at $(date -u '+%Y-%m-%dT%H:%M:%SZ')"
          echo "event=${{ github.event_name }}"